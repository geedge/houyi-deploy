[main]
log_path=./houyi_log/runtime.log
log_level=20

log_interval=3
fs2_remote_server_ip=192.168.40.1
fs2_remote_server_port=8152

[cc]
#因双网卡透明模式下, DNS server安装在internal, 很多时候为了复用方便, nginx也装在了同一台服务器,
#但本来cc模式是要send to external的, 此处加一个配置文件, 便于在不同环境测试.
#正式环境下, 默认肯定是ItoE的
default_send_dir=EtoI

[maat]
table_info=./houyi_etc/maat_tableinfo.conf
#json, redis, local_file
#config_src_type=redis
config_src_type=json
json_cfg_file=/opt/houyi/bin/houyi_etc/maat_test.json
inc_dir=./redis_dump/
full_dir=./redis_dump/
redis_server_ip=192.168.40.131
redis_server_port=7002
redis_index=0