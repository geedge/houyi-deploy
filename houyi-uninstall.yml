---
- hosts: sled-mcn0
  tasks:
    - name: "stop sapp service"
      service:
        name: sapp
        state: stopped

    - name: "stop houyi service"
      service:
        name: houyi
        state: stopped
      
    - name: "uninstall sapp"
      yum:
        name: "sapp"
        state: absent   

    - name: "uninstall houyi"
      yum:
        name: "houyi"
        state: absent           

    - name: "uninstall houyi-plug"
      yum:
        name: "houyi-plug"
        state: absent           

    - name: "uninstall net_flood"
      yum:
        name: "net_flood"
        state: absent
        
    - name: "remove sapp"
      file: 
        path: /home/mesasoft/sapp_run/
        state: absent
        force: 1

      